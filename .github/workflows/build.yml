name: Build ORIA Apps

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-child:
    name: Build ORIA Child APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Install dependencies
        run: |
          cd oria_child
          flutter pub get

      - name: Verify Android config
        run: |
          cd oria_child
          flutter doctor -v

      - name: Build APK
        run: |
          cd oria_child
          flutter build apk --debug

      - name: Upload Child APK
        uses: actions/upload-artifact@v4
        with:
          name: oria-child-apk
          path: oria_child/build/app/outputs/flutter-apk/app-debug.apk

  build-parent:
    name: Build ORIA Parent APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Install dependencies
        run: |
          cd oria_parent
          flutter pub get

      - name: Verify Android config
        run: |
          cd oria_parent
          flutter doctor -v

      - name: Build APK
        run: |
          cd oria_parent
          flutter build apk --debug

      - name: Upload Parent APK
        uses: actions/upload-artifact@v4
        with:
          name: oria-parent-apk
          path: oria_parent/build/app/outputs/flutter-apk/app-debug.apk