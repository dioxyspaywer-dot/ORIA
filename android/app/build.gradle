plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'app.oria.control'
    compileSdk 35

    defaultConfig {
        applicationId 'app.oria.control'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    flavorDimensions += 'role'
    productFlavors {
        parent {
            dimension 'role'
            applicationIdSuffix '.parent'
            resValue 'string', 'app_name', 'oria xx'
            buildConfigField 'String', 'APP_ROLE', '"parent"'
        }
        child {
            dimension 'role'
            applicationIdSuffix '.child'
            resValue 'string', 'app_name', 'oria'
            buildConfigField 'String', 'APP_ROLE', '"child"'
        }
    }

    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
}
